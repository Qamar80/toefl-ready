
name: toefl_pro
description: TOEFL iBT practice app built with Flutter + GetX.
publish_to: 'none'
#version: 1.0.0+2
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_fonts: ^6.2.1
  get_storage: ^2.1.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.2
  fluttertoast: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/t1/
    - assets/audios/t2/
    - assets/audios/t3/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
